<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NinFlix Banner</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .banner-container {
            width: 100%;
            max-width: 1200px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .banner {
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: white;
            position: relative;
            z-index: 2;
        }
        .banner-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }
        .logo i {
            font-size: 40px;
            color: white;
        }
        .title-section h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(to right, #ffffff, #e94560);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .title-section p {
            font-size: 1rem;
            opacity: 0.9;
        }
        .banner-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.1;
            overflow: hidden;
        }
        .banner-bg::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, #e94560 0%, transparent 70%);
            animation: pulse 15s infinite alternate;
        }
        @keyframes pulse {
            0% {
                transform: scale(0.8) rotate(0deg);
            }
            100% {
                transform: scale(1.2) rotate(360deg);
            }
        }
        .android-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            z-index: 3;
            font-size: 0.8rem;
        }
        .android-badge i {
            margin-right: 5px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #e94560;
            display: flex;
            align-items: center;
        }
        .section-title i {
            margin-right: 8px;
        }
        .content-types {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .content-type {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 10px;
            flex: 1;
            text-align: center;
            transition: transform 0.3s;
        }
        .content-type:hover {
            transform: translateY(-5px);
        }
        .content-type i {
            font-size: 24px;
            margin-bottom: 5px;
            color: #e94560;
        }
        .content-type p {
            font-size: 0.9rem;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .feature {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            transition: transform 0.3s, background 0.3s;
        }
        .feature:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        .feature i {
            font-size: 20px;
            margin-right: 10px;
            color: #e94560;
        }
        .feature span {
            font-size: 0.9rem;
        }
        .quality-section {
            margin-bottom: 15px;
        }
        .quality-badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
        }
        .badge i {
            margin-right: 5px;
        }
        .sd {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }
        .hd {
            background: rgba(33, 150, 243, 0.2);
            color: #2196F3;
            border: 1px solid #2196F3;
        }
        .fhd {
            background: rgba(156, 39, 176, 0.2);
            color: #9C27B0;
            border: 1px solid #9C27B0;
        }
        .uhd {
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
            border: 1px solid #FF9800;
        }
        .tech-stack {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tech {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            font-size: 0.8rem;
        }
        .tech i {
            margin-right: 5px;
            color: #e94560;
        }
        .highlight-box {
            background: rgba(233, 69, 96, 0.1);
            border-left: 4px solid #e94560;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .highlight-box h3 {
            margin-bottom: 5px;
            color: #e94560;
            font-size: 1rem;
        }
        .highlight-box p {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 10px;
            flex: 1;
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-item:hover {
            transform: translateY(-5px);
        }
        .stat-item i {
            font-size: 24px;
            margin-bottom: 5px;
            color: #e94560;
        }
        .stat-item .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 3px;
        }
        .stat-item .stat-label {
            font-size: 0.7rem;
            opacity: 0.8;
        }
        @media (max-width: 768px) {
            .banner {
                padding: 15px;
            }
            .title-section h1 {
                font-size: 2rem;
            }
            .logo {
                width: 60px;
                height: 60px;
            }
            .logo i {
                font-size: 30px;
            }
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stats-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <div class="banner-bg"></div>
        <div class="android-badge">
            <i class="fab fa-android"></i> Android App
        </div>
        <div class="banner">
            <div class="banner-header">
                <div class="logo">
                    <i class="fas fa-play"></i>
                </div>
                <div class="title-section">
                    <h1>NinFlix</h1>
                    <p>Live Streaming & OTT Platform</p>
                </div>
            </div>
            
            <div class="highlight-box">
                <h3>🎬 Stream Everything, Anywhere, Anytime</h3>
                <p>Movies, Series, Animes & Live TV with a powerful Admin Panel for complete content control</p>
            </div>
            
            <div class="stats-row">
                <div class="stat-item">
                    <i class="fas fa-film"></i>
                    <div class="stat-value">4K</div>
                    <div class="stat-label">Max Quality</div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-feather"></i>
                    <div class="stat-value">16KB</div>
                    <div class="stat-label">Native Libraries</div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-users"></i>
                    <div class="stat-value">100%</div>
                    <div class="stat-label">Firebase Backend</div>
                </div>
            </div>
            
            <div class="section-title">
                <i class="fas fa-film"></i> Content Types
            </div>
            <div class="content-types">
                <div class="content-type">
                    <i class="fas fa-film"></i>
                    <p>Movies</p>
                </div>
                <div class="content-type">
                    <i class="fas fa-tv"></i>
                    <p>Series</p>
                </div>
                <div class="content-type">
                    <i class="fas fa-dragon"></i>
                    <p>Animes</p>
                </div>
                <div class="content-type">
                    <i class="fas fa-broadcast-tower"></i>
                    <p>Live TV</p>
                </div>
            </div>
            
            <div class="section-title">
                <i class="fas fa-star"></i> Key Features
            </div>
            <div class="features-grid">
                <div class="feature">
                    <i class="fas fa-cogs"></i>
                    <span>Admin Panel</span>
                </div>
                <div class="feature">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Login & Signup</span>
                </div>
                <div class="feature">
                    <i class="fas fa-user-plus"></i>
                    <span>Make Account</span>
                </div>
                <div class="feature">
                    <i class="fas fa-heart"></i>
                    <span>Favorites</span>
                </div>
                <div class="feature">
                    <i class="fas fa-play-circle"></i>
                    <span>Continue Watching</span>
                </div>
                <div class="feature">
                    <i class="fas fa-bell"></i>
                    <span>Custom Notifications</span>
                </div>
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <span>DRM Protection</span>
                </div>
                <div class="feature">
                    <i class="fas fa-wifi"></i>
                    <span>Network Detection</span>
                </div>
                <div class="feature">
                    <i class="fas fa-user-lock"></i>
                    <span>VPN Protection</span>
                </div>
                <div class="feature">
                    <i class="fas fa-chart-line"></i>
                    <span>Real-time Analytics</span>
                </div>
                <div class="feature">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Adaptive Streaming</span>
                </div>
                <div class="feature">
                    <i class="fas fa-link"></i>
                    <span>Embedded Sources</span>
                </div>
                <div class="feature">
                    <i class="fas fa-dollar-sign"></i>
                    <span>Monetization Ready</span>
                </div>
            </div>
            
            <div class="section-title">
                <i class="fas fa-tv"></i> Video Quality
            </div>
            <div class="quality-section">
                <div class="quality-badges">
                    <div class="badge sd">
                        <i class="fas fa-mobile-alt"></i> SD 480p
                    </div>
                    <div class="badge hd">
                        <i class="fas fa-tablet-alt"></i> HD 720p
                    </div>
                    <div class="badge fhd">
                        <i class="fas fa-laptop"></i> Full HD 1080p
                    </div>
                    <div class="badge uhd">
                        <i class="fas fa-desktop"></i> 4K UHD
                    </div>
                </div>
            </div>
            
            <div class="section-title">
                <i class="fas fa-code"></i> Technology Stack
            </div>
            <div class="tech-stack">
                <div class="tech">
                    <i class="fab fa-java"></i> Java
                </div>
                <div class="tech">
                    <i class="fab fa-android"></i> Kotlin
                </div>
                <div class="tech">
                    <i class="fas fa-fire"></i> Firebase
                </div>
                <div class="tech">
                    <i class="fas fa-play-circle"></i> ExoPlayer
                </div>
                <div class="tech">
                    <i class="fas fa-shield-alt"></i> DRM
                </div>
                <div class="tech">
                    <i class="fas fa-database"></i> Firestore
                </div>
                <div class="tech">
                    <i class="fas fa-cloud"></i> Cloud Storage
                </div>
                <div class="tech">
                    <i class="fas fa-bell"></i> FCM
                </div>
                <div class="tech">
                    <i class="fas fa-chart-bar"></i> Analytics
                </div>
                <div class="tech">
                    <i class="fas fa-ad"></i> StartApp Ads
                </div>
            </div>
        </div>
    </div>
</body>
</html>
